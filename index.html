<style>/* =====================================================================
   GIAO DIỆN — kiểu hồ sơ gọn (tham khảo cách làm của trang Brittany Chiang):
   chữ là chính, các phần đánh số theo thứ tự, một màu nhấn hổ phách (màu mắt robot).
   Đổi màu: sửa các biến ở :root bên dưới.
   ===================================================================== */
:root, :root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
:root {
  --bg: #0E1116; --bg-2: #151922; --bg-3: #1C212B;
  --text: #E8E6E1; --text-2: #ABB0B9; --dim: #9AA0AA;
  --accent: #FFB547; --accent-mo: rgba(255,181,71,.1);
  --line: rgba(232,230,225,.14);
  --f-chu: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
  --f-ma: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  --pad: clamp(20px, 9vw, 150px);
  --ease: cubic-bezier(.645, .045, .355, 1);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-padding-top: 80px; }
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }
html.khoa-cuon, html.khoa-cuon body { overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--text-2); font-family: var(--f-chu); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: var(--accent); text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
:focus-visible { outline: 2px dashed var(--accent); outline-offset: 3px; }
h1, h2, h3 { color: var(--text); margin: 0; text-wrap: balance; }
p { margin: 0; }
[hidden] { display: none !important; }
.bo-qua { position: absolute; left: -9999px; top: 0; z-index: 70; background: var(--accent); color: var(--bg); padding: 12px 16px; }
.bo-qua:focus { left: 16px; top: calc(var(--safe-t) + 16px); }

/* ---------- thanh trên ---------- */
.top { position: sticky; top: var(--safe-t); z-index: 30; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 0 max(20px, var(--safe-r)) 0 max(20px, var(--safe-l)); background: rgba(14,17,22,.92); backdrop-filter: blur(8px); transition: transform .3s var(--ease), box-shadow .3s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--safe-t); z-index: 31; background: var(--bg); }
.top.an { transform: translateY(-110%); }
.top.co-bong { box-shadow: 0 10px 30px -10px rgba(0,0,0,.7); }
.logo { width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--accent); color: var(--accent); font: 600 15px var(--f-ma); letter-spacing: .02em; text-decoration: none !important; }
.menu { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.menu a { color: var(--text); font: 13px var(--f-ma); padding: 12px 10px; text-decoration: none; }
.menu a .so, .menu-dt a .so { color: var(--accent); margin-right: 4px; }
.menu a:hover { color: var(--accent); }
.phai { display: flex; align-items: center; gap: 10px; }
.but-chi { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: var(--accent); color: var(--bg); border: 0; cursor: pointer; }
.nut-menu { display: none; width: 44px; height: 44px; background: none; border: 0; padding: 10px 6px; cursor: pointer; flex-direction: column; justify-content: space-between; align-items: flex-end; }
.nut-menu span { display: block; height: 2px; background: var(--accent); width: 30px; } .nut-menu span:nth-child(2) { width: 24px; } .nut-menu span:nth-child(3) { width: 18px; }
.menu-dt { position: fixed; z-index: 29; inset: 0; background: rgba(10,12,16,.97); display: flex; align-items: center; justify-content: center; padding: 96px 24px calc(var(--safe-b) + 24px); }
.menu-dt nav { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.menu-dt a { color: var(--text); font: 18px var(--f-ma); padding: 12px 20px; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
@media (max-width: 768px) { .menu { display: none; } .nut-menu { display: flex; } }
.menu-gon .menu { display: none; } .menu-gon .nut-menu { display: flex; } /* nhiều mục: menu gọn */
.menu-dt { overflow-y: auto; align-items: safe center; } .menu-dt a { flex-direction: row; gap: 6px; padding: 10px 20px; } /* nhiều mục vẫn cuộn được */

/* ---------- hai cột bên (máy tính) ---------- */
.ben { position: fixed; bottom: 0; z-index: 10; width: 40px; display: none; flex-direction: column; align-items: center; }
.ben::after { content: ""; display: block; width: 1px; height: 90px; margin-top: 18px; background: var(--text-2); }
.ben.trai { left: max(40px, var(--safe-l)); } .ben.phai { right: max(40px, var(--safe-r)); }
@media (min-width: 1081px) { .ben { display: flex; } }
.mxh { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.mxh a { width: 44px; height: 44px; display: grid; place-items: center; color: var(--text-2); }
.mxh a:hover { color: var(--accent); transform: translateY(-3px); }
.mxh svg { width: 20px; height: 20px; }
.mxh.ngang { flex-direction: row; justify-content: center; margin-top: 36px; }
@media (min-width: 1081px) { .mxh.ngang { display: none; } }
.mail-dung { writing-mode: vertical-rl; font: 12px var(--f-ma); letter-spacing: .1em; color: var(--text-2); padding: 10px; }
.mail-dung:hover { color: var(--accent); text-decoration: none; }

/* ---------- khung nội dung ---------- */
main { max-width: 1600px; margin: 0 auto; padding: 0 var(--pad); padding-left: max(var(--pad), calc(16px + var(--safe-l))); padding-right: max(var(--pad), calc(16px + var(--safe-r))); }
.phan { max-width: 1000px; margin: 0 auto; padding: 100px 0; }
.phan.hep { max-width: 700px; }
@media (max-width: 768px) { .phan { padding: 72px 0; } }
.tieu-de { display: flex; align-items: center; gap: 10px; margin: 0 0 40px; font-size: clamp(26px, 5vw, 32px); font-weight: 600; white-space: nowrap; }
.tieu-de .so { font: 400 clamp(16px, 3vw, 20px) var(--f-ma); color: var(--accent); }
.tieu-de::after { content: ""; display: block; flex: 1; max-width: 300px; height: 1px; margin-left: 16px; background: var(--line); }
@media (max-width: 600px) { .tieu-de { white-space: normal; align-items: baseline; font-size: 24px; } .tieu-de::after { display: none; } }

/* hiện dần khi cuộn tới: chỉ trượt nhẹ, luôn nhìn thấy */
.hien { transition: transform .6s var(--ease), opacity .6s var(--ease); }
.hien.cho { transform: translateY(20px); opacity: .001; }

/* ---------- mở đầu ---------- */
.mo-dau { min-height: calc(100svh - 72px); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 0; padding: 40px 0 96px; max-width: 1000px; margin: 0 auto; }
.chao { margin: 0 0 24px 4px; font: 400 clamp(14px, 2vw, 16px) var(--f-ma); color: var(--accent); }
.ten { font-size: clamp(40px, 8vw, 80px); font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
.viec { margin-top: 8px; font-size: clamp(30px, 7vw, 72px); font-weight: 700; line-height: 1.12; color: var(--text-2); }
.loi-ngan { margin-top: 24px; max-width: 540px; font-size: clamp(16px, 2vw, 19px); }
.nut-to { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 48px; padding: 0 28px; border: 1px solid var(--accent); color: var(--accent); font: 14px var(--f-ma); background: transparent; text-decoration: none !important; transition: background .25s; cursor: pointer; }
.nut-to:hover { background: var(--accent-mo); }

/* ---------- thẻ và lưới ảnh dùng chung (mục riêng và mục chung đều dùng) ---------- */
.luoi-the { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 15px; }
.the { height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 28px 26px; background: var(--bg-3); border-radius: 4px; transition: transform .25s var(--ease); }
.the.co-link:hover { transform: translateY(-6px); }
.the-dau { display: flex; justify-content: space-between; align-items: center; color: var(--accent); }
.the-dau svg { width: 38px; height: 38px; }
.the h3 { font-size: 21px; font-weight: 600; } .the h3 a { color: var(--text); }
.the p { font-size: 15px; }


.luoi-anh-nho { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 45%), 1fr)); gap: 8px; }
.luoi-anh-nho button { display: block; width: 100%; aspect-ratio: 1; padding: 0; border: 0; background: var(--bg-3); cursor: zoom-in; overflow: hidden; }
.luoi-anh-nho img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---------- liên hệ ---------- */
.lien-he { max-width: 640px; margin: 0 auto; padding: 100px 0 120px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.so-lh { font: 16px var(--f-ma); color: var(--accent); }
.lien-he h2 { font-size: clamp(38px, 6vw, 58px); font-weight: 700; }
.lh-nut { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.lh-nut .nut-to { margin-top: 24px; }
.email-chu { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; font: 14px var(--f-ma); color: var(--text); user-select: all; }
.chep { min-height: 36px; padding: 0 12px; background: none; border: 1px solid var(--line); color: var(--text-2); font: 12px var(--f-ma); cursor: pointer; user-select: none; }
.zalo { margin-top: 28px; display: flex; align-items: center; gap: 24px; text-align: left; padding: 18px; background: var(--bg-2); border: 1px solid var(--line); }
.zalo img { width: 140px; height: auto; display: block; background: #fff; }
.zalo p { color: var(--text); margin-bottom: 8px; }
.zalo a { display: inline-flex; min-height: 44px; align-items: center; font: 14px var(--f-ma); }
@media (max-width: 480px) { .zalo { flex-direction: column; text-align: center; } }
.chan { padding: 24px 16px calc(var(--safe-b) + 84px); text-align: center; font: 12px var(--f-ma); color: var(--text-2); }

/* ---------- robot bay lượn ---------- */
.robot-ve { position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; will-change: transform; }
.robot-cham { position: fixed; left: 0; top: 0; z-index: 26; padding: 0; border: 0; background: transparent; border-radius: 30%; cursor: pointer; will-change: transform; touch-action: pan-y; }
.robot-cham:focus-visible { outline: 2px dashed var(--accent); }
@media (prefers-reduced-motion: reduce) { .hien.cho { transform: none; opacity: 1; } .the.co-link:hover { transform: none; } }

/* ---------- nút viền (xem tất cả ảnh) ---------- */
.nut-vien { margin-top: 28px; min-height: 48px; padding: 0 20px; display: inline-flex; align-items: center; gap: 10px; font: 14px var(--f-ma); color: var(--accent); background: transparent; border: 1px solid var(--accent); cursor: pointer; }
.nut-vien .so-anh { color: var(--text-2); }

/* ---------- hộp đen ---------- */
.bb-btn { position: fixed; z-index: 30; right: 16px; bottom: calc(var(--safe-b) + 16px); height: 44px; padding: 0 14px;
  font: 500 12px 'JetBrains Mono', monospace; color: var(--dim); background: rgba(17,19,23,.75); border: 1px solid var(--line); cursor: pointer; backdrop-filter: blur(6px); }
.bb-panel { position: fixed; z-index: 40; left: 12px; right: 12px; top: calc(var(--safe-t) + 12px); bottom: calc(var(--safe-b) + 12px); max-width: 640px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #0b0c0f; border: 1px solid var(--line); }
.bb-panel[hidden] { display: none; }
.bb-title { font: 500 12px 'JetBrains Mono', monospace; color: var(--dim); }
.bb-text { flex: 1; width: 100%; resize: none; background: #000; color: #cfcbc2; border: 1px solid var(--line); font: 11px/1.5 'JetBrains Mono', monospace; padding: 10px; }
.bb-row { display: flex; gap: 10px; }
.bb-row button { flex: 1; height: 48px; font: 600 14px var(--f-chu); border: 1px solid var(--line); background: #1a1c21; color: var(--text); cursor: pointer; }
.bb-row .bb-copy { background: var(--accent); color: #111317; border-color: var(--accent); }

/* ---------- lớp phủ: lưới ảnh, phóng to ---------- */
.lop { position: fixed; inset: 0; z-index: 50; background: rgba(8,9,11,.96); opacity: 0; transition: opacity .32s var(--ease); overflow-y: auto; overscroll-behavior: contain; }
.lop.mo { opacity: 1; }
.lop-dau { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  padding: calc(var(--safe-t) + 10px) var(--pad) 10px; background: linear-gradient(rgba(8,9,11,.98), rgba(8,9,11,.85)); }
.lop-dau h3 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.lop-dong { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--text); border: 1px solid var(--line); cursor: pointer; }
.luoi-anh { columns: 2; column-gap: 6px; padding: 6px var(--pad) calc(var(--safe-b) + 72px); }
@media (min-width: 900px) { .luoi-anh { columns: 4; } }
.o-anh { display: block; width: 100%; margin: 0 0 6px; padding: 0; border: 0; background: #1a1c21; cursor: zoom-in; break-inside: avoid; transform: translateY(16px); opacity: 0; animation: len .7s var(--ease) forwards; }
.o-anh img { display: block; width: 100%; height: auto; min-height: 60px; }
.o-anh.loi { min-height: 120px; }
@keyframes len { to { transform: none; opacity: 1; } }
.phong-to { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pt-anh { max-width: 100%; max-height: calc(100svh - var(--safe-t) - var(--safe-b) - 150px); object-fit: contain; touch-action: none; user-select: none; -webkit-user-drag: none;
  transition: transform .45s var(--ease), opacity .35s; }
.pt-chu { position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--safe-b) + 24px); margin: 0; text-align: center; font-size: 15px; color: #C9C5BB; }
.pt-so { position: absolute; left: var(--pad); top: calc(var(--safe-t) + 22px); font: 500 12px 'JetBrains Mono', monospace; color: var(--dim); }
.phong-to .lop-dong { position: absolute; right: var(--pad); top: calc(var(--safe-t) + 10px); }
.pt-nut { position: absolute; top: 50%; width: 48px; height: 64px; margin-top: -32px; display: flex; align-items: center; justify-content: center;
  background: rgba(17,19,23,.6); color: var(--text); border: 1px solid var(--line); cursor: pointer; }
.pt-nut.trai { left: 12px; } .pt-nut.phai { right: 12px; }
@media (max-aspect-ratio: 9/10) { .pt-nut { top: auto; bottom: calc(var(--safe-b) + 64px); margin-top: 0; } }

/* ---------- trang quản lý ---------- */
.ql { position: fixed; z-index: 60; inset: 0; display: flex; flex-direction: column; background: #111317; color: var(--text);
  transform: translateY(24px); opacity: 0; transition: transform .4s var(--ease), opacity .3s; }
.ql.mo { transform: none; opacity: 1; }
@media (min-width: 900px) { .ql { left: auto; width: 480px; border-left: 1px solid var(--line); box-shadow: -30px 0 60px rgba(0,0,0,.5); } }
.ql-dau { display: flex; justify-content: space-between; align-items: center; padding: calc(var(--safe-t) + 6px) 16px 6px; border-bottom: 1px solid var(--line); }
.ql-dau strong { font-size: 20px; font-weight: 800; }
.ql-dong, .ql-lui { min-height: 44px; padding: 0 4px; background: none; border: 0; color: var(--dim); font: 500 13px 'JetBrains Mono', monospace; cursor: pointer; }
.ql-lui { margin-bottom: 4px; }
.ql-the { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.ql-the button { min-height: 46px; background: none; border: 0; color: var(--dim); font: 500 12px 'JetBrains Mono', monospace; cursor: pointer; }
.ql-the button.on { background: var(--text); color: var(--bg); }
.ql-than { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px; display: flex; flex-direction: column; gap: 14px; }
.ql-chan { display: flex; gap: 10px; padding: 10px 16px calc(var(--safe-b) + 16px); border-top: 1px solid var(--line); }
.ql-chan:empty { display: none; }
.ql-chan button { flex: 1; }
.ql-chinh, .ql-phu, .ql-xoa { min-height: 52px; padding: 0 16px; font: 600 16px var(--f-chu); cursor: pointer; border: 1px solid var(--accent); }
.ql-chinh { background: var(--accent); color: #111317; }
.ql-chinh:disabled { opacity: .6; cursor: wait; }
.ql-phu { background: transparent; color: var(--text); border-color: var(--line); }
.ql-xoa { background: transparent; color: #ff8a7a; border-color: rgba(255,138,122,.45); margin-top: 8px; }
.ql-o { display: flex; flex-direction: column; gap: 6px; font: 500 11px 'JetBrains Mono', monospace; color: var(--dim); }
.ql-o input, .ql-o textarea { min-height: 46px; background: #1a1c21; border: 1px solid var(--line); color: var(--text); padding: 10px; font: 16px var(--f-chu); border-radius: 0; }
.ql-o input:focus, .ql-o textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.ql-ghi { margin: 0; font-size: 14px; line-height: 1.5; color: #C9C5BB; }
.ql-ghi.nho { font-size: 12px; color: var(--dim); }
.ql-loi { margin: 0; min-height: 1em; font-size: 14px; color: #ff8a7a; }
.ql-ds { list-style: none; margin: 0; padding: 0; }
.ql-dong-ds { display: flex; align-items: center; gap: 10px; min-height: 64px; border-bottom: 1px solid var(--line); background: #111317; position: relative; }
.ql-dong-ds.dang-keo { z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,.6); background: #1a1c21; }
.ql-dong-ds.vua-doi { background: #1a1c21; }
.ql-dong-ds.anh input { flex: 1; min-width: 0; min-height: 44px; background: #1a1c21; border: 1px solid var(--line); color: var(--text); padding: 0 8px; font: 15px var(--f-chu); }
.ql-keo { width: 36px; min-height: 48px; background: none; border: 0; color: var(--dim); font-size: 18px; cursor: grab; touch-action: none; }
.ql-anh-nho { width: 44px; height: 44px; object-fit: cover; flex-shrink: 0; background: #1a1c21; display: block; }
.ql-ten { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ql-sua { min-height: 44px; min-width: 52px; background: none; border: 0; color: var(--dim); font: 500 12px 'JetBrains Mono', monospace; cursor: pointer; }
.ql-nhan { font: 500 12px 'JetBrains Mono', monospace; color: #9fb0ff; border: 1px solid #6f86ff; padding: 3px 5px; margin-right: 6px; }
.tu-bang { opacity: .85; padding-left: 46px; }
.ql-chon-anh { display: block; width: 100%; padding: 0; background: none; border: 1px dashed var(--dim); cursor: pointer; }
.ql-xem-anh { min-height: 96px; display: flex; align-items: center; justify-content: center; color: #C9C5BB; font: 15px var(--f-chu); }
.ql-xem-anh img { display: block; max-width: 100%; max-height: 240px; }
.ql-mau { margin: 0; padding: 10px; background: #1a1c21; font: 11px/1.6 'JetBrains Mono', monospace; color: #C9C5BB; white-space: pre-wrap; word-break: break-all; }
.ql-bao { position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 92px); padding: 12px 14px; background: #24262c; border-left: 3px solid var(--accent);
  font-size: 14px; line-height: 1.4; transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .35s var(--ease), opacity .3s; }
.ql-bao.hien { transform: none; opacity: 1; }
.ql-bao.loi { border-left-color: #ff8a7a; } .ql-bao.tot { border-left-color: #7ed99a; } .ql-bao.canh { border-left-color: #ffd36e; }

.ql-chon { display: flex; align-items: center; gap: 12px; min-height: 48px; font-size: 15px; color: #C9C5BB; cursor: pointer; }
.ql-chon input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }

.ql-nhom { margin: 10px 0 0; font: 600 13px var(--f-ma); color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.ql-chon-anh.hep .ql-xem-anh img { max-height: 160px; }
@media (min-width: 700px) { .ql-the { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

/* Hộp đen trên điện thoại/máy tính bảng: nằm cuối trang (sau chân trang), không nổi đè lên chữ */
@media (max-width: 1080px) {
  .bb-btn { position: static; display: block; margin: 0 auto calc(var(--safe-b) + 24px); backdrop-filter: none; background: transparent; }
}

/* Khoảnh khắc chưa có ảnh */
.trong { color: var(--text-2); font-size: 16px; padding: 28px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
/* Quản lý → Các mục */
.ql-o select { min-height: 46px; background: #1a1c21; border: 1px solid var(--line); color: var(--text); padding: 0 10px; font: 16px var(--f-chu); }
.ql-ten small { display: block; font: 400 12px var(--f-ma); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.ql-bat { display: grid; place-items: center; width: 44px; height: 44px; flex: none; cursor: pointer; }
.ql-bat input { width: 22px; height: 22px; accent-color: var(--accent); }
/* thẻ có ảnh (mục chung kiểu lưới thẻ) */
.the-anh { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; margin-bottom: 6px; }
.the-mo { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font: 13px var(--f-ma); color: var(--text); }
.the-mo:hover { color: var(--accent); }

/* ===== muc/chung ===== */
/* ---------- mục chung: kiểu danh sách và đoạn chữ ---------- */
.ds-dong { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; max-width: 46em; }
.ds-dong li { position: relative; padding-left: 26px; color: var(--text-2); }
.ds-dong li::before { content: "▹"; position: absolute; left: 0; color: var(--accent); }
.ds-dong strong, .ds-dong a { color: var(--text); font-weight: 600; }
.doan-chu { display: flex; flex-direction: column; gap: 16px; max-width: 40em; }
.ds-dong a { display: inline-block; padding: 4px 0; } /* vùng bấm ≥ 24px */

/* ===== muc/gioi-thieu ===== */
/* ---------- giới thiệu ---------- */
.gt { display: grid; grid-template-columns: 3fr 2fr; gap: 50px; align-items: start; }
@media (max-width: 768px) { .gt { grid-template-columns: minmax(0, 1fr); } }
.gt-chu { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
#gt-van { display: flex; flex-direction: column; gap: 16px; max-width: 34em; }
.thong-tin { margin: 8px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
.thong-tin div { min-width: 0; }
.thong-tin dt { font: 12px var(--f-ma); color: var(--accent); letter-spacing: .04em; }
.thong-tin dd { margin: 2px 0 0; color: var(--text); font-size: 16px; }
.ky-nang-dau { margin-top: 8px; }
.ky-nang { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(140px, 200px)); gap: 6px 10px; font: 13px var(--f-ma); }
.ky-nang li { position: relative; padding-left: 20px; }
.ky-nang li::before { content: "▹"; position: absolute; left: 0; color: var(--accent); }
.chan-dung { position: relative; margin: 0; max-width: 300px; justify-self: center; }
.chan-dung img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; position: relative; z-index: 1; filter: grayscale(.4) contrast(1.05); transition: filter .3s, transform .3s var(--ease); }
.chan-dung::after { content: ""; position: absolute; inset: 0; transform: translate(16px, 16px); border: 2px solid var(--accent); transition: transform .3s var(--ease); }
.chan-dung:hover img { filter: none; transform: translate(-4px, -4px); } .chan-dung:hover::after { transform: translate(12px, 12px); }


/* ===== muc/khoanh-khac ===== */
/* ---------- khoảnh khắc ---------- */
/* lưới ảnh dùng chung nằm trong src/style.css (.luoi-anh-nho) */

/* ===== muc/kinh-nghiem ===== */
/* ---------- kinh nghiệm (thẻ bấm) ---------- */
.the-kn { display: flex; gap: 24px; }
@media (max-width: 600px) { .the-kn { flex-direction: column; } }
.the-ds { display: flex; flex-direction: column; border-left: 2px solid var(--line); min-width: max-content; }
@media (max-width: 600px) { .the-ds { flex-direction: row; overflow-x: auto; border-left: 0; border-bottom: 2px solid var(--line); min-width: 0; } }
.the-ds button { min-height: 44px; padding: 0 20px; margin-left: -2px; background: none; border: 0; border-left: 2px solid transparent; color: var(--text-2); font: 13px var(--f-ma); text-align: left; white-space: nowrap; cursor: pointer; }
.the-ds button[aria-selected="true"] { color: var(--accent); border-left-color: var(--accent); background: var(--accent-mo); }
@media (max-width: 600px) { .the-ds button { margin: 0 0 -2px; border-left: 0; border-bottom: 2px solid transparent; } .the-ds button[aria-selected="true"] { border-bottom-color: var(--accent); } }
.the-noi { min-width: 0; padding-top: 6px; }
.the-noi h3 { font-size: 21px; font-weight: 500; } .the-noi h3 .o { color: var(--accent); }
.the-noi .tg { margin: 4px 0 18px; font: 13px var(--f-ma); color: var(--text-2); }
.the-noi ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.the-noi li { position: relative; padding-left: 26px; } .the-noi li::before { content: "▹"; position: absolute; left: 0; color: var(--accent); }


/* ===== muc/phim ===== */
/* ---------- phim ---------- */
.luoi-phim { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 24px; }
.phim-o { display: flex; flex-direction: column; gap: 12px; color: var(--text-2); }
.phim-anh { aspect-ratio: 16 / 9; background: var(--bg-3); overflow: hidden; }
.phim-anh img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s var(--ease); }
.phim-o:hover .phim-anh img { transform: scale(1.04); }
.phim-o h3 { font-size: 20px; font-weight: 600; } .phim-o .tg { font: 13px var(--f-ma); color: var(--text-2); }


/* ===== muc/san-pham ===== */
/* ---------- sản phẩm ---------- */
.noi-bat { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 100px; }
@media (max-width: 768px) { .noi-bat { gap: 40px; } }
.nb { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: center; }
.nb-anh { grid-column: 1 / 8; grid-row: 1; position: relative; display: block; background: var(--accent); }
.nb-anh img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; mix-blend-mode: multiply; filter: grayscale(1) contrast(1.05) brightness(.9); transition: all .3s var(--ease); }
.nb-anh:hover img { mix-blend-mode: normal; filter: none; }
.nb-chu { grid-column: 7 / -1; grid-row: 1; position: relative; z-index: 2; text-align: right; }
.nb.dao .nb-anh { grid-column: 6 / -1; } .nb.dao .nb-chu { grid-column: 1 / 7; text-align: left; }
.nb-nhan { margin: 0 0 6px; font: 13px var(--f-ma); color: var(--accent); }
.nb-chu h3 { font-size: clamp(22px, 4vw, 28px); font-weight: 600; margin-bottom: 18px; }
.nb-chu h3 a { color: var(--text); }
.nb-mo-ta { padding: 24px; background: var(--bg-3); border-radius: 4px; box-shadow: 0 10px 30px -15px rgba(0,0,0,.8); color: var(--text-2); font-size: 16px; }
.nb-lien { margin-top: 14px; display: flex; gap: 6px; justify-content: flex-end; } .nb.dao .nb-lien { justify-content: flex-start; }
.nb-lien a { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font: 13px var(--f-ma); color: var(--text); }
.nb-lien a:hover { color: var(--accent); }
@media (max-width: 768px) {
  .nb, .nb.dao { display: block; position: relative; background: var(--bg-3); border-radius: 4px; overflow: hidden; }
  .nb-anh, .nb.dao .nb-anh { position: absolute; inset: 0; opacity: .14; }
  .nb-anh img { height: 100%; aspect-ratio: auto; }
  .nb-chu, .nb.dao .nb-chu { text-align: left; padding: 32px 24px; }
  .nb-mo-ta { padding: 0; background: none; box-shadow: none; color: var(--text); }
  .nb-lien, .nb.dao .nb-lien { justify-content: flex-start; margin-left: -8px; }
}
.tieu-de-phu { margin: 100px 0 24px; text-align: center; font-size: clamp(22px, 4vw, 30px); font-weight: 600; }
</style>
</head>
